# Phylogenetic workflow configuration for Tahyna virus (TAHV).

# Ingest outputs to build from (relative to this Snakefile's directory).
ingest_results: "../ingest/results"

# One build per genome segment. label = the value in the curated metadata
# `segment` column; min_length = augur filter floor, ~50% of the RefSeq
# segment length (user decision 2026-10-02: S >= ~490, M >= ~2245, L >= ~3490).
segments:
  s:
    label: "S"
    min_length: 490    # NC_055206.1 = 978 nt
    ref_length: 978
  m:
    label: "M"
    min_length: 2245   # NC_055205.1 = 4489 nt
    ref_length: 4489
  l:
    label: "L"
    min_length: 3490   # NC_055207.1 = 6979 nt
    ref_length: 6979

# Per-segment nextclade custom reference packages (reference.fasta +
# annotation.gff3 + pathogen.json; see references/ in the repo root).
references:
  s: "../references/s"
  m: "../references/m"
  l: "../references/l"

# QC gate (APPROVED by user 2026-10-02, exactly as proposed in
# docs/qc-review.md): drop a record failing ANY hard criterion below. Only
# treeless-computable metrics are used; private-mutation gating needs a
# reference tree and is a deferred refinement pass.
qc_gate:
  min_coverage: 0.5
  # per-segment missing-data maxima = pathogen.json missingData thresholds
  missing_data_max:
    s: 500
    m: 2250
    l: 3500
  # divergence-outlier band, as a fraction of the reference length (treeless
  # proxy for the private-mutations gate; observed maxima <= 17.3% of ref)
  max_substitutions_frac: 0.25
  zero_frameshifts: true
  zero_stop_codons: true
  # Records kept despite a failing criterion, so their annotations stay
  # visible; each entry surfaces as qc_exception=true in the metadata and the
  # gate report. Judge artifact-vs-real from branch mutations on the tree.
  exceptions:
    - "PJ01_OP727996"  # L build, 1 frameshift (Cai 2023; passaged 1x C6/36 + 2x BHK-21)

# Outgroup rooting (user decision 2026-10-03, replacing --root best): Lumbo
# virus, TAHV's closest relative (~89% nt on S; the published precedent is
# Calzolari 2022 rooting TAHV trees with Lumbo). RefSeq segments of strain
# SAAr 1881, committed at fixture/outgroup/<segment>.fasta with the controlled
# header OUTGROUP (the tip name in every tree).
#
# Mechanics: mafft --add --keeplength joins the outgroup to the aligned
# ingroup; iqtree + refine root on the OUTGROUP tip (this anchors the clock -
# S gets its timetree attempt back); export then HIDES the outgroup tip via a
# {"nodes": {OUTGROUP: {"hidden": "always"}}} node-data file instead of
# pruning the tree (pruning would merge the outgroup's long branch into the
# ingroup base and distort divergence display). Set enabled: false to build
# without it.
outgroup:
  enabled: true
  tip_name: "OUTGROUP"
  accessions:
    s: "NC_043631.1"  # Lumbo virus SAAr 1881 segment S (1077 nt)
    m: "NC_043630.1"  # segment M (4490 nt)
    l: "NC_043632.1"  # segment L (6980 nt)

# --- Locked tree settings (user decisions 2026-10-02) ---
tree:
  method: iqtree   # augur 34 passes fixed GTR + '--ninit 2 -n 2 --epsilon 0.05 -T AUTO --redo'
  nthreads: 4
refine:
  timetree: true
  date_confidence: true
  coalescent: opt       # no --stochastic-resolve: polytomies kept
  date_inference: marginal
  root: best            # ignored while outgroup.enabled is true (rooted on the outgroup)
  clock_filter_iqd: 10  # loosened from default 4 to keep historic/imputed tips
  # Per-segment overrides for settings that cannot hold everywhere.
  overrides:
    s:
      # S has no usable clock even with the outgroup: treetime's rate estimate
      # stays negative (temporally flat European lineage 1957-2021; the 1962-
      # dated Lumbo outgroup is not older than the old TAHV tips and so cannot
      # anchor the regression - it would make the slope worse). S ships as an
      # OUTGROUP-ROOTED divergence tree (root position from Lumbo, no dates).
      # Evidence: docs/qc-review.md.
      timetree: false
      root: null
ancestral:
  inference: joint
traits:
  columns:
    - country
    - region
